services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: channelpilot
      POSTGRES_USER: channelpilot
      POSTGRES_PASSWORD: channelpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channelpilot -d channelpilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  channelpilot:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
